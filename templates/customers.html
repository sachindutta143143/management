<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Customer Management — Multi Plaza</title><style>
*{box-sizing:border-box}body{margin:0;background:#eef3f8;color:#172033;font:14px Arial}
header{background:#173f65;color:white;padding:18px}main{max-width:1100px;margin:auto;padding:16px}
.card{background:white;border:1px solid #d9e2ec;border-radius:12px;padding:16px;margin-bottom:14px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px}
input,textarea{width:100%;padding:10px;border:1px solid #cbd5e1;border-radius:7px;font:inherit}
button{border:0;background:#214e79;color:white;border-radius:7px;padding:10px 14px;cursor:pointer;font-weight:700}
button.danger{background:#b42318}button.light{background:#e8eef5;color:#173f65}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
table{width:100%;border-collapse:collapse;background:white}th,td{padding:10px;border-bottom:1px solid #e2e8f0;text-align:left}
.tablewrap{overflow:auto}.muted{color:#64748b;font-size:12px}
@media(max-width:600px){main{padding:9px}.card{padding:12px}}
</style><script src="/static/offline-sync.js"></script>
</head><body><header><h2 style="margin:0">M/S. MULTI PLAZA — CUSTOMER MANAGEMENT</h2><p>Customer records are saved to the shared database.</p></header>
<main><section class="card"><h3 id="formTitle">Add Customer</h3><form id="customerForm"><input type="hidden" id="customerId">
<div class="grid"><input id="name" placeholder="Customer / Company Name" required><input id="mobile" placeholder="Mobile Number">
<input id="email" placeholder="Email"><input id="gstin" placeholder="GSTIN">
<input id="state" placeholder="State"><input id="city" placeholder="City">
<input id="pincode" placeholder="PIN Code"><textarea id="address" placeholder="Full Address" rows="2"></textarea></div>
<div class="actions"><button type="submit">Save Customer</button><button type="button" class="light" id="clearBtn">Clear</button></div></form><p class="muted" id="message"></p></section>
<section class="card"><div class="grid"><h3>Customer List</h3><input id="search" placeholder="Search name / mobile / GSTIN"></div>
<div class="tablewrap"><table><thead><tr><th>Name</th><th>Mobile</th><th>GSTIN</th><th>Location</th><th>Actions</th></tr></thead><tbody id="customerRows"></tbody></table></div></section></main>
<script>
let customers=[];let customerAutoTimer=null;let customerSaving=false;
const $=id=>document.getElementById(id);
function customerPayload(){return {name:$('name').value.trim(),mobile:$('mobile').value,email:$('email').value,gstin:$('gstin').value,state:$('state').value,city:$('city').value,pincode:$('pincode').value,address:$('address').value}}
function scheduleCustomerAutoSave(){clearTimeout(customerAutoTimer);try{localStorage.setItem('mp_customer_draft',JSON.stringify({id:$('customerId').value,data:customerPayload()}))}catch(e){}$('message').textContent='Changes pending…';customerAutoTimer=setTimeout(saveCustomerAuto,800)}
async function saveCustomerAuto(){if(customerSaving)return;const c=customerPayload();if(!c.name){$('message').textContent='Draft saved on this device. Enter customer name to save to database.';return}customerSaving=true;try{let id=$('customerId').value;let r=await fetch(id?'/api/customers/'+id:'/api/customers',{method:id?'PUT':'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(c)});if(!r.ok)throw Error();let saved=await r.json();$('customerId').value=saved.id;$('message').textContent='Auto-saved to database.';try{localStorage.setItem('mp_customer_draft',JSON.stringify({id:saved.id,data:c}))}catch(e){}await load()}catch(e){$('message').textContent='Auto-save failed. Draft remains on this device.'}finally{customerSaving=false}}
function flushCustomerDraft(){
  clearTimeout(customerAutoTimer);
  try{localStorage.setItem('mp_customer_draft',JSON.stringify({id:$('customerId').value,data:customerPayload()}));}catch(e){}
  const c=customerPayload();
  if(!c.name)return;
  const id=$('customerId').value;
  try{
    fetch(id?'/api/customers/'+id:'/api/customers',{method:id?'PUT':'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(c),keepalive:true});
  }catch(e){}
}
window.addEventListener('pagehide',flushCustomerDraft);
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='hidden')flushCustomerDraft();});
['name','mobile','email','gstin','state','city','pincode','address'].forEach(id=>$(id).addEventListener('input',scheduleCustomerAutoSave));
async function load(){try{let r=await fetch('/api/customers');if(!r.ok)throw Error();customers=await r.json();render()}catch(e){$('message').textContent='Could not load customers. Check server/database connection.'}}
function render(){let q=$('search').value.toLowerCase();$('customerRows').innerHTML='';customers.filter(c=>[c.name,c.mobile,c.gstin,c.city].join(' ').toLowerCase().includes(q)).forEach(c=>{let tr=document.createElement('tr');[c.name,c.mobile,c.gstin,[c.city,c.state].filter(Boolean).join(', ')].forEach(v=>{let td=document.createElement('td');td.textContent=v||'';tr.append(td)});let td=document.createElement('td');let e=document.createElement('button');e.textContent='Edit';e.className='light';e.onclick=()=>edit(c);let d=document.createElement('button');d.textContent='Delete';d.className='danger';d.onclick=()=>remove(c.id);td.append(e,d);tr.append(td);$('customerRows').append(tr)})}
function edit(c){$('customerId').value=c.id;$('name').value=c.name||'';$('mobile').value=c.mobile||'';$('email').value=c.email||'';$('gstin').value=c.gstin||'';$('state').value=c.state||'';$('city').value=c.city||'';$('pincode').value=c.pincode||'';$('address').value=c.address||'';$('formTitle').textContent='Edit Customer';window.scrollTo({top:0,behavior:'smooth'})}
$('customerForm').onsubmit=async e=>{e.preventDefault();clearTimeout(customerAutoTimer);await saveCustomerAuto();$('message').textContent='Customer auto-saved. You can continue editing.'};
async function remove(id){if(!confirm('Delete this customer?'))return;let r=await fetch('/api/customers/'+id,{method:'DELETE'});if(r.ok)load()}
$('clearBtn').onclick=()=>{clearTimeout(customerAutoTimer);$('customerForm').reset();$('customerId').value='';$('formTitle').textContent='Add Customer';$('message').textContent='';localStorage.removeItem('mp_customer_draft')};
$('search').oninput=render;load();try{let d=JSON.parse(localStorage.getItem('mp_customer_draft')||'null');if(d&&d.data&&!$('customerId').value){$('customerId').value=d.id||'';Object.entries(d.data).forEach(([k,v])=>{if($(k))$(k).value=v||''});if(d.id)$('formTitle').textContent='Edit Customer';}}catch(e){}
</script><style>
#mpSectionRefresh{position:fixed;right:14px;bottom:14px;z-index:99990;border:1px solid #b8c9dc;border-radius:20px;background:#173f65;color:#fff;padding:9px 14px;font:700 12px Arial,sans-serif;box-shadow:0 3px 12px #0003;cursor:pointer}
#mpSectionRefresh:active{transform:scale(.98)}
@media print{#mpSectionRefresh{display:none!important}}
</style>
<button id="mpSectionRefresh" type="button" title="Refresh this section">↻ Refresh</button>
<script>
(function(){
  const btn=document.getElementById('mpSectionRefresh');
  if(!btn)return;
  let lastActivity=Date.now();
  let nextRefresh=Date.now()+60000;
  const editable='input,textarea,select,[contenteditable="true"]';
  const standalone=()=>window.matchMedia('(display-mode: standalone)').matches || window.matchMedia('(display-mode: window-controls-overlay)').matches || navigator.standalone===true;
  ['pointerdown','keydown','input','change','touchstart'].forEach(type=>document.addEventListener(type,()=>{lastActivity=Date.now();},{capture:true,passive:true}));
  function safeToReload(){
    if(document.visibilityState!=='visible')return false;
    if(Date.now()-lastActivity<20000)return false;
    const active=document.activeElement;
    if(active&&active.matches&&active.matches(editable))return false;
    if(document.querySelector('[aria-modal="true"],.modal.show,.modal[open]'))return false;
    return true;
  }
  function refreshSection(){
    if(!safeToReload())return false;
    btn.disabled=true;btn.textContent='Refreshing…';
    window.location.reload();
    return true;
  }
  btn.addEventListener('click',()=>{
    // Manual refresh is explicit; browser page reload preserves server-side records.
    btn.disabled=true;btn.textContent='Refreshing…';window.location.reload();
  });
  // Installed desktop app only: refresh at 60-second intervals, but defer while user is active/editing.
  setInterval(()=>{
    if(!standalone()||Date.now()<nextRefresh)return;
    if(refreshSection())nextRefresh=Date.now()+60000;
    else nextRefresh=Date.now()+5000;
  },5000);
})();
</script>
</body></html>
