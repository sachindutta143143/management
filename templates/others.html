<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Others — Multi Plaza</title><style>
*{box-sizing:border-box}body{margin:0;background:#eef3f8;color:#172033;font:14px Arial}header{background:#173f65;color:white;padding:17px}main{padding:14px;max-width:1200px;margin:auto}
.panel{background:#fff;border:1px solid #dbe3ec;border-radius:12px;padding:14px;margin-bottom:14px}.tools{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
button{border:0;border-radius:8px;background:#214e79;color:#fff;padding:9px 13px;font-weight:bold;cursor:pointer}.light{background:#eaf0f7;color:#173f65}
.wrap{overflow:auto}table{width:100%;min-width:850px;border-collapse:collapse;table-layout:fixed}th,td{border:1px solid #d8e0e9;padding:5px;vertical-align:top}th{background:#173f65;color:white;position:sticky;top:0}
input,textarea{width:100%;border:0;outline:0;background:transparent;padding:6px;font:13px Arial;min-width:0}textarea{min-height:48px;height:48px;resize:vertical;white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.35}
td:focus-within{background:#eff6ff;outline:2px solid #2563eb;outline-offset:-2px}.muted{color:#64748b;font-size:12px}
@media(max-width:600px){main{padding:8px}.panel{padding:9px}header{padding:12px}textarea{min-height:54px;height:54px;font-size:14px}}
</style><script src="/static/offline-sync.js"></script>
</head><body><header><h2 style="margin:0">OTHERS</h2><p style="margin:6px 0 0">Additional records / miscellaneous entries</p></header>
<main><section class="panel"><div class="tools"><button id="add">+ Add Row</button><button class="light" id="save">Save Changes</button><span class="muted" id="status">Ready</span></div></section>
<section class="panel"><div class="wrap"><table><thead><tr><th style="width:14%">Date</th><th style="width:22%">Customer / Name</th><th style="width:30%">Particulars</th><th style="width:14%">Amount</th><th style="width:20%">Remarks</th><th style="width:55px">Del.</th></tr></thead><tbody id="rows"></tbody></table></div></section></main>
<script>
const KEY='mp_others_draft';
const fields=['date','customer','particulars','amount','remarks'];
let data=[];
let saveTimer=null;
let localWritePending=false;
let lastSharedSnapshot='';
let initialized=false;
function parseDate(value){let t=String(value||'').trim();if(!t)return '';let m=t.match(/^(\d{1,2})-(\d{1,2})-(\d{4})$/);if(m){let d=+m[1],mo=+m[2],y=+m[3],dt=new Date(Date.UTC(y,mo-1,d));if(dt.getUTCFullYear()!==y||dt.getUTCMonth()!==mo-1||dt.getUTCDate()!==d)return null;return `${y}-${String(mo).padStart(2,'0')}-${String(d).padStart(2,'0')}`}m=t.match(/^(\d{4})-(\d{2})-(\d{2})$/);return m?t:null}
function displayDate(v){let iso=parseDate(v);if(!iso)return String(v||'');let [y,m,d]=iso.split('-');return `${d}-${m}-${y}`}
function row(v={}){return {date:parseDate(v.date)||v.date||'',customer:v.customer||'',particulars:v.particulars||'',amount:v.amount||'',remarks:v.remarks||''}}
function render(){
  let b=document.getElementById('rows');b.innerHTML='';
  data.forEach((r,i)=>{
    let tr=document.createElement('tr');
    fields.forEach(k=>{
      let td=document.createElement('td'),el=document.createElement(k==='date'||k==='amount'?'input':'textarea');
      if(k==='date'){el.type='text';el.placeholder='DD-MM-YYYY';el.inputMode='numeric'}if(k==='amount')el.type='number';
      el.value=k==='date'?displayDate(r[k]):(r[k]??'');el.placeholder=k==='customer'?'Name / second line...':k==='particulars'?'Enter details...':'';
      el.oninput=()=>{data[i][k]=k==='date'?(parseDate(el.value)||el.value):el.value;saveSoon()};if(k==='date')el.onblur=()=>{let v=parseDate(el.value);if(v){data[i][k]=v;el.value=displayDate(v);saveSoon()}else if(el.value.trim()){el.setCustomValidity('Use DD-MM-YYYY');el.reportValidity();el.setCustomValidity('')}};td.append(el);tr.append(td)
    });
    let td=document.createElement('td'),btn=document.createElement('button');btn.textContent='×';btn.className='light';
    btn.onclick=()=>{if(!confirm('Delete this row?'))return;data.splice(i,1);render();save()};td.append(btn);tr.append(td);b.append(tr)
  });
}
function setStatus(message){document.getElementById('status').textContent=message}
function saveSoon(){localWritePending=true;setStatus('Changes pending…');clearTimeout(saveTimer);saveTimer=setTimeout(save,650)}
async function save(){
  clearTimeout(saveTimer);
  const body=JSON.stringify(data);
  localWritePending=true;
  try{localStorage.setItem(KEY,body)}catch(e){}
  try{
    const r=await fetch('/api/data/others_register',{method:'PUT',headers:{'Content-Type':'application/json'},body,cache:'no-store'});
    if(!r.ok)throw Error('HTTP '+r.status);
    lastSharedSnapshot=body;
    const hasNewerEdits=JSON.stringify(data)!==body;
    localWritePending=hasNewerEdits;
    setStatus(hasNewerEdits?'Saving newer changes…':'Saved to shared database');
    if(hasNewerEdits)saveSoon();
  }catch(e){localWritePending=false;setStatus('Save failed — server/database connection unavailable');console.error('Others save failed:',e)}
}
async function loadInitial(){
  let local=[];
  try{const v=JSON.parse(localStorage.getItem(KEY)||'null');if(Array.isArray(v))local=v.map(row)}catch(e){}
  try{
    const r=await fetch('/api/data/others_register',{cache:'no-store'});
    if(!r.ok)throw Error('HTTP '+r.status);
    const server=await r.json();if(!Array.isArray(server))throw Error('Invalid server data');
    if(server.length){data=server.map(row);lastSharedSnapshot=JSON.stringify(server);setStatus('Loaded from shared database');}
    else if(local.length){data=local;setStatus('Recovering this browser backup to shared database…');await save();}
    else{data=[];lastSharedSnapshot='[]';setStatus('Connected — no records yet');}
  }catch(e){data=local;setStatus(local.length?'Server unavailable — showing this browser backup':'Could not connect to shared database');console.error('Others initial load failed:',e)}
  initialized=true;render();
  try{localStorage.setItem(KEY,JSON.stringify(data))}catch(e){}
}
async function refreshFromServer(){
  if(!initialized||document.visibilityState!=='visible'||localWritePending)return;
  // Do not replace values while a user is typing in a table cell.
  if(document.activeElement&&document.activeElement.closest&&document.activeElement.closest('#rows'))return;
  try{
    const r=await fetch('/api/data/others_register',{cache:'no-store'});if(!r.ok)return;
    const remote=await r.json();if(!Array.isArray(remote))return;
    const snapshot=JSON.stringify(remote);
    if(snapshot!==lastSharedSnapshot){data=remote.map(row);lastSharedSnapshot=snapshot;try{localStorage.setItem(KEY,snapshot)}catch(e){}render();setStatus('Updated from another device');}
  }catch(e){console.warn('Others live sync failed:',e)}
}
function flushOthers(){
  clearTimeout(saveTimer);
  if(!localWritePending)return;
  try{const body=JSON.stringify(data);localStorage.setItem(KEY,body);fetch('/api/data/others_register',{method:'PUT',headers:{'Content-Type':'application/json'},body,keepalive:true});}catch(e){}
}
window.addEventListener('pagehide',flushOthers);
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='hidden')flushOthers();else refreshFromServer()});
setInterval(refreshFromServer,3000);
document.getElementById('add').onclick=()=>{data.push(row());render();saveSoon()};
document.getElementById('save').onclick=save;
loadInitial();
</script><style>
#mpSectionRefresh{position:fixed;right:14px;bottom:14px;z-index:99990;border:1px solid #b8c9dc;border-radius:20px;background:#173f65;color:#fff;padding:9px 14px;font:700 12px Arial,sans-serif;box-shadow:0 3px 12px #0003;cursor:pointer}
#mpSectionRefresh:active{transform:scale(.98)}
@media print{#mpSectionRefresh{display:none!important}}
</style>
<button id="mpSectionRefresh" type="button" title="Refresh this section">↻ Refresh</button>
<script>
(function(){
  const btn=document.getElementById('mpSectionRefresh');
  if(!btn)return;
  let lastActivity=Date.now();
  let nextRefresh=Date.now()+60000;
  const editable='input,textarea,select,[contenteditable="true"]';
  const standalone=()=>window.matchMedia('(display-mode: standalone)').matches || window.matchMedia('(display-mode: window-controls-overlay)').matches || navigator.standalone===true;
  ['pointerdown','keydown','input','change','touchstart'].forEach(type=>document.addEventListener(type,()=>{lastActivity=Date.now();},{capture:true,passive:true}));
  function safeToReload(){
    if(document.visibilityState!=='visible')return false;
    if(Date.now()-lastActivity<20000)return false;
    const active=document.activeElement;
    if(active&&active.matches&&active.matches(editable))return false;
    if(document.querySelector('[aria-modal="true"],.modal.show,.modal[open]'))return false;
    return true;
  }
  function refreshSection(){
    if(!safeToReload())return false;
    btn.disabled=true;btn.textContent='Refreshing…';
    window.location.reload();
    return true;
  }
  btn.addEventListener('click',()=>{
    // Manual refresh is explicit; browser page reload preserves server-side records.
    btn.disabled=true;btn.textContent='Refreshing…';window.location.reload();
  });
  // Installed desktop app only: refresh at 60-second intervals, but defer while user is active/editing.
  setInterval(()=>{
    if(!standalone()||Date.now()<nextRefresh)return;
    if(refreshSection())nextRefresh=Date.now()+60000;
    else nextRefresh=Date.now()+5000;
  },5000);
})();
</script>
</body></html>
