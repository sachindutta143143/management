<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#123e66"><link rel="manifest" href="/manifest.webmanifest"><link rel="apple-touch-icon" href="/static/icons/icon-192.png"><title>Multi Plaza Management</title>
<style>*{box-sizing:border-box}body{margin:0;background:#edf3f8;font-family:Arial;color:#172033}.top{background:linear-gradient(115deg,#102f50,#1d5682);color:white;padding:16px;position:sticky;top:0;z-index:3}.top h2{margin:0 0 12px;font-size:19px}.nav{display:flex;gap:7px;flex-wrap:wrap}.nav a{color:white;text-decoration:none;border:1px solid #ffffff55;padding:10px 13px;border-radius:8px;font-weight:bold;font-size:13px}.nav a:hover{background:white;color:#173f65}iframe{display:block;width:100%;height:calc(100vh - 112px);min-height:600px;border:0;background:#f3f6fb}@media(max-width:600px){.top{padding:10px}.top h2{font-size:16px}.nav{display:grid;grid-template-columns:repeat(2,minmax(0,1fr))}.nav a{text-align:center;padding:9px 4px;font-size:11px}iframe{height:calc(100dvh - 110px);min-height:520px}}</style><script src="/static/offline-sync.js"></script>

</nav></header><iframe name="workspace" src="/product" title="Multi Plaza workspace"></iframe><script>if("serviceWorker" in navigator){window.addEventListener("load",()=>navigator.serviceWorker.register("/sw.js").catch(err=>console.warn("PWA service worker:",err)));}</script><button id="mpBackupButton" style="position:fixed;right:14px;bottom:54px;z-index:99998;background:#fff;border:1px solid #9ab0ca;border-radius:22px;padding:9px 13px;color:#173b68;font-weight:700;box-shadow:0 2px 8px #0002" onclick="(async()=>{try{if(navigator.onLine){const r=await fetch('/api/backup/export');if(!r.ok)throw Error();const b=await r.blob();const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='Multi-Plaza-Database-Backup-'+new Date().toISOString().slice(0,10)+'.json';a.click();URL.revokeObjectURL(a.href)}else{MultiPlazaBackup.exportLocal()}}catch(e){MultiPlazaBackup.exportLocal()}})()">⬇ Backup</button>
